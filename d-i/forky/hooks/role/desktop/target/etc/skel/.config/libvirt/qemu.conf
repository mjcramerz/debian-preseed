# Managed by unattended-installer.
#
# The unprivileged libvirtd session cannot create or load per-guest
# AppArmor profiles. Disable only its dynamic sVirt driver so it does not probe
# the privileged loaded-profile registry. This reverts to the package-provided
# basic AppArmor host-protection model; qemu:///system retains its separate
# system configuration and dynamic sVirt policy.
security_driver = "none"
remember_owner = 0
lock_manager = "lockd"
stdio_handler = "logd"
