# Retain libvirt daemon records in the managed log tree. QEMU guest console
# logs are handled separately by virtlogd beneath the account-private cache.
if (
  $programname == "managed-libvirt-runtime" or
  $programname == "virt-session-storage" or
  $programname == "virt-host-managed" or
  $programname == "libvirtd" or
  $programname == "virtlogd" or
  $programname == "virtlockd"
) then {
  set $.managed_security_routed = "on";
  action(
    name="managed_libvirt_daemons_log"
    type="omfile"
    file="/var/log/managed/libvirt/daemons.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0751"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}
