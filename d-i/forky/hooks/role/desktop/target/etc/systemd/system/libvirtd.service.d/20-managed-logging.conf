[Unit]
# The package-owned libvirtd unit currently orders against the misspelled
# virtlock.service. The managed QEMU policy requires lockd, so add the correct
# socket requirement and service shutdown ordering without replacing the
# package-owned unit.
Requires=virtlockd.socket
After=virtlockd.service

[Service]
StandardOutput=journal
StandardError=journal
SyslogIdentifier=libvirtd
