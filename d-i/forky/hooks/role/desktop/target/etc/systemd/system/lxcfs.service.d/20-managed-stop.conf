[Service]
ExecStop=
# Unmount while lxcfs is still alive so fuse_main can return successfully
# instead of reporting a failed daemon exit after systemd has already killed it.
ExecStop=/usr/local/libexec/lxcfs-stop
ExecStopPost=
# The managed helper treats an already-unmounted lxcfs path as success while
# preserving a real failure for an unexpected filesystem. Keep an idempotent
# post-stop fallback for a mount recreated or left visible during daemon exit.
ExecStopPost=/usr/local/libexec/lxcfs-stop
TimeoutStopSec=15s
