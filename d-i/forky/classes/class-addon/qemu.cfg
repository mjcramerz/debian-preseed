# Desktop virtualization baseline with managed /pool-backed target staging.
# Packages stay explicit so pkgsel does not pull in broader workstation stacks
# through recommends.
# Keep the GUI management clients and install QEMU's host OpenGL display
# modules explicitly.
d-i pkgsel/include string qemu-system-x86 qemu-system-modules-opengl qemu-utils qemu-block-extra ovmf swtpm swtpm-tools virtiofsd virt-manager virt-install virt-viewer libvirt-common libvirt-daemon libvirt-daemon-common libvirt-daemon-config-nwfilter libvirt-daemon-driver-network libvirt-daemon-driver-nodedev libvirt-daemon-driver-nwfilter libvirt-daemon-driver-qemu libvirt-daemon-driver-secret libvirt-daemon-driver-storage libvirt-daemon-log libvirt-daemon-lock libvirt-daemon-plugin-lockd libvirt-clients dnsmasq-base bridge-utils passt incus incus-client incus-ui-canonical lxc lxcfs lxc-templates uidmap libosinfo-bin genisoimage vagrant/trixie vagrant-libvirt/trixie
d-i pkgsel/include seen true

# Zabbly Incus Stable (Debian Trixie)
d-i apt-setup/local17/repository string https://pkgs.zabbly.com/incus/stable trixie main
d-i apt-setup/local17/comment string Zabbly Incus Stable (Debian Trixie)
d-i apt-setup/local17/key string https://pkgs.zabbly.com/key.asc
d-i apt-setup/local17/source boolean false
