# Server suite override: keep the installer and target baseline on Debian
# Trixie while still exposing Debian Forky as the first fallback archive.
d-i mirror/codename string trixie
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie

# Debian Forky (Testing)
d-i apt-setup/local1/repository string https://deb.debian.org/debian forky main contrib non-free non-free-firmware
d-i apt-setup/local1/comment string Debian Forky
d-i apt-setup/local1/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local1/source boolean true

# Debian XanMod Kernel
d-i apt-setup/local2/repository string https://deb.xanmod.org trixie main non-free
d-i apt-setup/local2/comment string XanMod kernel archive
d-i apt-setup/local2/key string https://dl.xanmod.org/archive.key
d-i apt-setup/local2/source boolean false

# Debian Trixie (Stable)
d-i apt-setup/local3/repository string https://deb.debian.org/debian trixie main contrib non-free non-free-firmware
d-i apt-setup/local3/comment string Debian Trixie (Stable)
d-i apt-setup/local3/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local3/source boolean true
