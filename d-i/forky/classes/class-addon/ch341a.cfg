# Firmware extraction and CH341A/CH347 workstation baseline.
# Debian Forky currently exposes cramfsswap instead of a cramfsprogs package in
# the configured archives, so the add-on uses the available cramfs utility.
d-i pkgsel/include string flashrom flashprog imsprog binwalk python3-binwalk uefitool uefitool-cli coreboot-utils mtd-utils squashfs-tools cramfsswap lz4 file binutils bsdextrautils xxd hexedit python3-magic okteta
d-i pkgsel/include seen true
